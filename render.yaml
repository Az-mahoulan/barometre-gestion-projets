# Démonstration GRATUITE sur Render (Blueprint).
# Limites de l'offre gratuite : les services s'endorment après 15 min d'inactivité (réveil d'environ 1 min) et la base
# gratuite est supprimée 30 jours après sa création. Ne pas y mettre de données réelles.
# Pour un usage durable : utiliser render.production.yaml (serveur privé, offres payantes).
databases:
  - name: barometre-db
    plan: free
    region: frankfurt
    databaseName: barometre
    user: barometre

services:
  # Serveur Django (public sur l'offre gratuite : un service gratuit ne peut pas recevoir de trafic privé)
  - type: web
    name: barometre-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: app/backend
    buildCommand: pip install -r requirements.txt && DJANGO_DEBUG=1 python manage.py collectstatic --noinput
    startCommand: >-
      sh -c 'python manage.py migrate --noinput
      && if [ "$SEED_DEMO" = "1" ]; then python manage.py seed_demo --if-empty; fi
      && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -'
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: barometre-db
          property: connectionString
      # À ajuster si Render ajoute un suffixe aux adresses (voir docs/deploiement-render.md)
      - key: DJANGO_ALLOWED_HOSTS
        value: barometre-api.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://barometre-pilotage.onrender.com
      # Démonstration uniquement : données fictives, comptes admin, mireille, sena, koffi…
      - key: SEED_DEMO
        value: "1"
      - key: APP_DEMO_TODAY
        value: "2026-10-14"
      - key: DEMO_PASSWORD
        generateValue: true

  # Interface Next.js (relaie /api vers le serveur Django)
  - type: web
    name: barometre-pilotage
    runtime: node
    region: frankfurt
    plan: free
    rootDir: app/frontend
    buildCommand: npm ci && npm run build
    startCommand: >-
      sh -c 'mkdir -p public
      && cp -r .next/static .next/standalone/.next/
      && cp -r public .next/standalone/
      && node .next/standalone/server.js'
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: HOSTNAME
        value: 0.0.0.0
      # À ajuster si l'adresse du serveur Django diffère
      - key: BACKEND_URL
        value: https://barometre-api.onrender.com
